<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f8fb;color:#163044}.top{background:#082335;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top button{border:1px solid #527187;background:transparent;color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer}.wrap{width:min(1150px,92%);margin:24px auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.section{background:#fff;border:1px solid #dbe8ef;border-radius:18px;padding:20px}.card b{display:block;font-size:28px;margin-top:8px}.section{margin-top:18px;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #ccdce5;border-radius:10px;font:inherit}.form textarea{min-height:90px}.full{grid-column:1/-1}.primary{background:#087ea8;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.msg{margin-top:10px}.item{padding:14px;border:1px solid #e2ebef;border-radius:12px;margin-top:10px}.item a{color:#087ea8;font-weight:700}.del{border:0;background:#ffe9e9;color:#a31e1e;border-radius:8px;padding:7px 10px;cursor:pointer}.empty{color:#78909c;padding:20px;text-align:center}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><header class="top"><h1>🛡️ لوحة الإدارة</h1><button onclick="logout()">تسجيل الخروج</button></header><main class="wrap"><div class="cards"><div class="card">طلاب<b id="students">-</b></div><div class="card">مدرسون<b id="teachers">-</b></div><div class="card">مدارس / مراكز<b id="schools">-</b></div><div class="card">المواد المنشورة<b id="materialsCount">-</b></div></div><section class="section"><h2>➕ إضافة فيديو / امتحان / اختبار / ملف</h2><div class="form"><input id="title" placeholder="اسم المحتوى"><select id="type"><option value="video">فيديو</option><option value="exam">امتحان</option><option value="test">اختبار</option><option value="file">ملف / PDF</option></select><textarea id="description" class="full" placeholder="وصف مختصر"></textarea><input id="file" class="full" type="file" accept="video/*,application/pdf,image/*,.doc,.docx,.ppt,.pptx,.zip"><button class="primary full" onclick="addMaterial()">رفع ونشر للناس</button></div><div id="uploadMsg" class="msg"></div></section><section class="section"><h2>📚 المحتوى المنشور</h2><div id="materials"></div></section><section class="section"><h2>👥 المستخدمون</h2><table style="width:100%;border-collapse:collapse"><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>التاريخ</th><th></th></tr></thead><tbody id="users"></tbody></table></section><section class="section"><h2>💬 رسائل المساعدة</h2><div id="help"></div></section></main><script>const role={student:'طالب',teacher:'مدرس',school:'مدرسة / مركز تعليمي'};async function guard(){const r=await fetch('/api/admin/me');const j=await r.json().catch(()=>({}));if(!j.admin){location.href='/admin-login.html';return false}return true}async function load(){if(!await guard())return;const r=await fetch('/api/admin/data');if(r.status===401){location.href='/admin-login.html';return}const j=await r.json();for(const k of ['students','teachers','schools'])document.getElementById(k).textContent=j.stats[k];const mats=await fetch('/api/materials').then(r=>r.json());document.getElementById('materialsCount').textContent=mats.length||0;document.getElementById('materials').innerHTML=mats.length?mats.map(x=>`<div class="item"><b>${esc(x.title)}</b> — ${typeName(x.type)}<div>${esc(x.description||'')}</div><div style="margin-top:8px"><a href="${esc(x.file_url)}" target="_blank" rel="noopener">فتح / تنزيل</a> <button class="del" onclick="removeMaterial('${x.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا يوجد محتوى منشور</div>';users.innerHTML=j.users.length?j.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${role[u.role]||u.role}</td><td>${new Date(u.createdAt).toLocaleString('ar-EG')}</td><td><button class="del" onclick="removeUser('${u.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">لا يوجد مستخدمون</td></tr>';help.innerHTML=j.helpMessages.length?j.helpMessages.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #edf2f5"><b>${esc(x.user?.name||'زائر')}</b> — ${new Date(x.createdAt).toLocaleString('ar-EG')}<div style="margin-top:6px">${esc(x.message)}</div></div>`).join(''):'<div class="empty">لا توجد رسائل</div>'}function typeName(t){return {video:'فيديو',exam:'امتحان',test:'اختبار',file:'ملف / PDF'}[t]||t}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function addMaterial(){const f=document.getElementById('file').files[0];if(!title.value.trim()||!f){uploadMsg.textContent='اكتب اسم المحتوى واختر الملف.';return}uploadMsg.textContent='جاري الرفع...';const r=await fetch('/api/admin/materials',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Title':title.value.trim(),'X-Type':type.value,'X-Description':description.value.trim(),'X-Filename':f.name},body:f});const j=await r.json().catch(()=>({}));if(!r.ok){uploadMsg.textContent='فشل رفع الملف: '+(j.error||'خطأ غير معروف');return}title.value='';description.value='';file.value='';uploadMsg.textContent='تم النشر بنجاح ✅';load()}async function removeMaterial(id){if(!confirm('حذف هذا المحتوى؟'))return;const r=await fetch('/api/admin/materials/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok)alert('تعذر الحذف');load()}async function removeUser(id){if(!confirm('حذف هذا المستخدم؟'))return;const r=await fetch('/api/admin/users/'+encodeURIComponent(id),{method:'DELETE'});if(r.ok)load();else alert('تعذر الحذف')}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.href='/admin-login.html'}load()</script></body></html>
