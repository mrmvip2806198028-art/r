<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة</title><style>body{margin:0;font-family:Tahoma,Arial;background:#071421;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:#102536;border:1px solid #21455e;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008}.logo{font-size:28px;font-weight:800;margin-bottom:8px}.hint{color:#a9c3d3;margin-bottom:22px}input{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #35566b;background:#0a1a28;color:#fff;font:inherit}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#10a7dc;color:#fff;font:inherit;font-weight:800;cursor:pointer}.msg{margin-top:12px;color:#ffb4b4;min-height:20px}</style></head><body><main class="box"><div class="logo">🔐 لوحة الإدارة</div><div class="hint">سجّل الدخول بحساب المدير الخاص بالموقع.</div><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button onclick="login()">دخول آمن</button><div class="msg" id="msg"></div></main><script>async function login(){msg.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=j.error||'تعذر تسجيل الدخول';return}location.href='/admin'}password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});(async()=>{const r=await fetch('/api/admin/me');const j=await r.json().catch(()=>({}));if(j.admin)location.href='/admin'})()</script></body></html>
